# 프로젝트 메타데이터와 도구 설정 (ruff, pytest).
# 런타임 의존성은 아직 없다 — M2(llm/)·M3(LangGraph)에서 사용자 승인 후 추가한다.

[project]
name = "code-test-agent"
version = "0.1.0"
description = "소스 변경에 맞춰 테스트 코드를 자동 생성·유지보수하는 LLM 에이전트 (PoC)"
requires-python = ">=3.11"
# langgraph: v4 5절이 확정한 오케스트레이션 프레임워크 (M3 서브그래프)
# neo4j: 코드 그래프 저장소 드라이버 (M4, v4 6.5)
# 게이트웨이 호출은 표준 라이브러리 urllib — 별도 SDK 불필요 (ADR-0011)
dependencies = [
    "langgraph>=0.2",
    "neo4j>=5",
]

[project.scripts]
# 설치(pip install -e .) 후 어디서든 `cta <명령>`으로 실행되는 CLI 진입점
cta = "cta.cli.main:main"

[tool.setuptools]
# 제품 코드는 전부 cta/ 아래 — 층 패키지들을 명시한다 (디렉터리 정리, 2026-09-02)
packages = ["cta", "cta.core", "cta.core.tools", "cta.core.pipeline",
            "cta.adapters", "cta.adapters.java", "cta.adapters.java.skills",
            "cta.graph", "cta.llm", "cta.sandbox", "cta.cli", "cta.evals"]

[tool.setuptools.package-data]
# 프롬프트 파일은 코드가 아니라 데이터 — 일반(비-편집) 설치에도 함께 담는다
"cta.llm" = ["prompts/*.md"]
# 스킬 본문도 데이터 — 폴더별 SKILL.md (ADR-0017)
"cta.adapters.java" = ["skills/*/SKILL.md"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# 왜 pythonpath: 리포 루트를 import 경로에 넣어 설치 없이도 cta 패키지를 찾게 한다.
# 층 이름(core/adapters/llm/...)은 cta/ 아래에 그대로 있어 CLAUDE.md 표기와 일치한다.
pythonpath = ["."]
testpaths = ["tests"]
# docker·neo4j 마커는 기본 실행에서 제외 — M0 관문 "외부 의존 없이 pytest 통과" 유지.
# 통합 테스트 실행: pytest -m docker / pytest -m neo4j
addopts = "-m 'not docker and not neo4j'"
markers = [
    "docker: 실제 Docker 데몬이 필요한 통합 테스트",
    "neo4j: 실제 Neo4j 컨테이너가 필요한 통합 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, UP: 최신 문법, B: 흔한 버그 패턴
select = ["E", "F", "I", "UP", "B"]
